networks:
  frontend:
    driver: ${NETWORKS_DRIVER}
  backend:
    driver: ${NETWORKS_DRIVER}

services:
  php-fpm:
    image: websk-skif/php-fpm:8.5.12
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: ${PHP_FPM_INSTALL_XDEBUG}
        INSTALL_ZIP_ARCHIVE: ${PHP_FPM_INSTALL_ZIP_ARCHIVE}
        INSTALL_MEMCACHED: ${PHP_FPM_INSTALL_MEMCACHED}
        INSTALL_INTL: ${PHP_FPM_INSTALL_INTL}
        INSTALL_PCNTL: ${PHP_FPM_INSTALL_PCNTL}
    volumes:
      - ./php-fpm/php8.5.ini:/usr/local/etc/php/php.ini:ro
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${PHP_TMP_PATH}:/tmp
    expose:
      - "9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG}
    networks:
      - backend

  nginx:
    build:
      context: ./nginx
      args:
        PHP_UPSTREAM_CONTAINER: ${NGINX_PHP_UPSTREAM_CONTAINER}
        PHP_UPSTREAM_PORT: ${NGINX_PHP_UPSTREAM_PORT}
    volumes:
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${NGINX_HOST_LOG_PATH}:/var/log/nginx
      - ${NGINX_SITES_PATH}:/etc/nginx/sites-available:ro
      - ${NGINX_SSL_PATH}:/etc/nginx/ssl:ro
    ports:
      - "${NGINX_HOST_HTTP_PORT}:80"
      - "${NGINX_HOST_HTTPS_PORT}:443"
    depends_on:
      - php-fpm
    networks:
      backend:
        aliases:
          - skif.devbox
      frontend:
        aliases:
          - skif.devbox

  mysql:
    build:
      context: ./mysql
      args:
        MYSQL_VERSION: ${MYSQL_VERSION}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${MYSQL_TIMEZONE}
    volumes:
      - ${DATA_PATH_HOST}/mysql:/var/lib/mysql
      - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - backend

  memcached:
    build:
      context: ./memcached
    ports:
      - "${MEMCACHED_HOST_PORT}:11211"
    networks:
      - backend
